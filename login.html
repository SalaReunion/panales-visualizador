<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Control de Pañales</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --font-primary: 'Outfit', sans-serif;
            --bg-app: #0b0f19;
            --bg-panel: #151c2c;
            --bg-card: rgba(30, 41, 59, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            --accent: #06b6d4;
            --accent-hover: #0891b2;
            --accent-glow: rgba(6, 182, 212, 0.25);
            --color-error: #ef4444;
            --color-success: #10b981;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 40%);
        }

        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            padding: 36px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(6, 182, 212, 0.1);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-badge {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, var(--accent), #0284c7);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.35);
        }

        .logo-badge i {
            color: #fff;
            width: 28px;
            height: 28px;
        }

        .login-header h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* Selector de Pestañas (Iniciar Sesión vs Registrarse) */
        .auth-nav-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .auth-tab-btn.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(2, 132, 199, 0.2));
            color: #fff;
            border: 1px solid rgba(6, 182, 212, 0.4);
            font-weight: 600;
        }

        .auth-tab-btn i {
            width: 15px;
            height: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-dark);
            width: 18px;
            height: 18px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 11px 14px 11px 44px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(15, 23, 42, 0.95);
        }

        .form-control:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .toggle-password i {
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #0284c7);
            border: none;
            border-radius: var(--radius-md);
            padding: 13px 20px;
            color: #fff;
            font-family: inherit;
            font-size: 0.96rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
            transition: all 0.2s ease;
            margin-top: 14px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0891b2, #0369a1);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            display: none;
            padding: 11px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 18px;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-error i {
            color: var(--color-error);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        .alert-success i {
            color: var(--color-success);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .switch-mode-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .switch-mode-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
            cursor: pointer;
        }

        .switch-mode-text a:hover {
            text-decoration: underline;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-badge">
                <i data-lucide="package"></i>
            </div>
            <h1 id="header-title">Control de Pañales</h1>
            <p id="header-desc">Ingreso seguro al sistema de visualización</p>
        </div>

        <!-- Pestañas de Selección: Iniciar Sesión vs Registrarse -->
        <div class="auth-nav-tabs">
            <button type="button" class="auth-tab-btn active" id="tab-login">
                <i data-lucide="log-in"></i>
                <span>Iniciar Sesión</span>
            </button>
            <button type="button" class="auth-tab-btn" id="tab-register">
                <i data-lucide="user-plus"></i>
                <span>Registrarse</span>
            </button>
        </div>

        <div id="alert-box" class="alert-box alert-error">
            <i data-lucide="alert-circle" id="alert-icon"></i>
            <span id="alert-message">Mensaje</span>
        </div>

        <form id="auth-form">
            <!-- Campo Nombre Completo (Solo visible en Registrarse) -->
            <div class="form-group" id="group-fullname" style="display: none;">
                <label class="form-label" for="fullname">Nombre y Apellido</label>
                <div class="input-wrapper">
                    <input type="text" id="fullname" class="form-control" placeholder="Ej: María Gómez">
                    <i data-lucide="badge-check" class="input-icon"></i>
                </div>
            </div>

            <!-- Campo Usuario -->
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-control" placeholder="Ingrese su usuario" autocomplete="username" required autofocus>
                    <i data-lucide="user" class="input-icon"></i>
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                    <i data-lucide="lock" class="input-icon"></i>
                    <button type="button" id="btn-toggle-password" class="toggle-password" title="Mostrar/Ocultar contraseña">
                        <i data-lucide="eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit">
                <span id="btn-text">Ingresar al Sistema</span>
                <div class="spinner" id="btn-spinner"></div>
                <i data-lucide="arrow-right" id="arrow-icon"></i>
            </button>
        </form>

        <div class="switch-mode-text">
            <span id="switch-prompt">¿No tienes cuenta?</span>
            <a id="switch-link">Regístrate aquí</a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Modo actual: 'login' o 'register'
        let currentMode = 'login';

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const headerDesc = document.getElementById('header-desc');
        const groupFullname = document.getElementById('group-fullname');
        const fullnameInput = document.getElementById('fullname');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const arrowIcon = document.getElementById('arrow-icon');
        const switchPrompt = document.getElementById('switch-prompt');
        const switchLink = document.getElementById('switch-link');
        const alertBox = document.getElementById('alert-box');
        const alertMsg = document.getElementById('alert-message');
        const alertIcon = document.getElementById('alert-icon');

        function setMode(mode) {
            currentMode = mode;
            alertBox.style.display = 'none';

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                headerDesc.textContent = 'Ingreso seguro al sistema de visualización';
                groupFullname.style.display = 'none';
                fullnameInput.required = false;
                btnText.textContent = 'Ingresar al Sistema';
                switchPrompt.textContent = '¿No tienes cuenta?';
                switchLink.textContent = 'Regístrate aquí';
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                headerDesc.textContent = 'Crea tu usuario para acceder al sistema';
                groupFullname.style.display = 'block';
                fullnameInput.required = true;
                btnText.textContent = 'Crear Cuenta e Ingresar';
                switchPrompt.textContent = '¿Ya tienes una cuenta?';
                switchLink.textContent = 'Inicia sesión';
            }
            lucide.createIcons();
        }

        tabLogin.addEventListener('click', () => setMode('login'));
        tabRegister.addEventListener('click', () => setMode('register'));
        switchLink.addEventListener('click', () => setMode(currentMode === 'login' ? 'register' : 'login'));

        // Mostrar / ocultar contraseña
        const btnTogglePass = document.getElementById('btn-toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        btnTogglePass.addEventListener('click', () => {
            const isPass = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPass ? 'text' : 'password');
            eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // Enviar Formulario
        const form = document.getElementById('auth-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const fullName = fullnameInput.value.trim();

            if (!username || !password) return;
            if (currentMode === 'register' && !fullName) return;

            // Estado de carga
            btnSubmit.disabled = true;
            btnText.textContent = currentMode === 'login' ? 'Verificando...' : 'Creando cuenta...';
            btnSpinner.style.display = 'inline-block';
            arrowIcon.style.display = 'none';

            const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';
            const payload = currentMode === 'login' 
                ? { username, password }
                : { username, password, full_name: fullName };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    btnText.textContent = 'Acceso concedido';
                    // Redirigir directamente al visualizador
                    window.location.href = '/';
                } else {
                    showAlert(data.message || 'Ocurrió un error inesperado.', 'error');
                    resetSubmitButton();
                }
            } catch (err) {
                showAlert('Error de conexión con el servidor. Reintente.', 'error');
                resetSubmitButton();
            }
        });

        function showAlert(msg, type = 'error') {
            alertMsg.textContent = msg;
            alertBox.className = 'alert-box ' + (type === 'success' ? 'alert-success' : 'alert-error');
            alertIcon.setAttribute('data-lucide', type === 'success' ? 'check-circle' : 'alert-circle');
            alertBox.style.display = 'flex';
            lucide.createIcons();
        }

        function resetSubmitButton() {
            btnSubmit.disabled = false;
            btnText.textContent = currentMode === 'login' ? 'Ingresar al Sistema' : 'Crear Cuenta e Ingresar';
            btnSpinner.style.display = 'none';
            arrowIcon.style.display = 'inline-block';
        }
    </script>
</body>
</html>
