<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Control de Pañales</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --font-primary: 'Outfit', sans-serif;
            --bg-app: #0b0f19;
            --bg-panel: #151c2c;
            --bg-card: rgba(30, 41, 59, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            --accent: #06b6d4;
            --accent-hover: #0891b2;
            --accent-glow: rgba(6, 182, 212, 0.25);
            --color-error: #ef4444;
            --color-success: #10b981;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 40%);
        }

        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(6, 182, 212, 0.1);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent), #0284c7);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.35);
        }

        .logo-badge i {
            color: #fff;
            width: 32px;
            height: 32px;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-dark);
            width: 18px;
            height: 18px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px 12px 44px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(15, 23, 42, 0.95);
        }

        .form-control:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .toggle-password i {
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #0284c7);
            border: none;
            border-radius: var(--radius-md);
            padding: 14px 20px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #0891b2, #0369a1);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-error i {
            color: var(--color-error);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .login-footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .audit-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-dark);
        }

        .audit-notice i {
            width: 14px;
            height: 14px;
            color: var(--accent);
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-badge">
                <i data-lucide="package"></i>
            </div>
            <h1>Control de Pañales</h1>
            <p>Ingreso seguro al sistema de visualización</p>
        </div>

        <div id="alert-box" class="alert-box alert-error">
            <i data-lucide="alert-circle"></i>
            <span id="alert-message">Usuario o contraseña incorrectos</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Usuario</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-control" placeholder="Ingrese su usuario" autocomplete="username" required autofocus>
                    <i data-lucide="user" class="input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                    <i data-lucide="lock" class="input-icon"></i>
                    <button type="button" id="btn-toggle-password" class="toggle-password" title="Mostrar/Ocultar contraseña">
                        <i data-lucide="eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit">
                <span id="btn-text">Ingresar al Sistema</span>
                <div class="spinner" id="btn-spinner"></div>
                <i data-lucide="arrow-right" id="arrow-icon"></i>
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        // Mostrar / ocultar contraseña
        const btnTogglePass = document.getElementById('btn-toggle-password');
        const passInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        btnTogglePass.addEventListener('click', () => {
            const isPass = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPass ? 'text' : 'password');
            eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // Enviar formulario de login
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const alertMsg = document.getElementById('alert-message');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const arrowIcon = document.getElementById('arrow-icon');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) return;

            // Estado cargando
            btnSubmit.disabled = true;
            btnText.textContent = 'Verificando...';
            btnSpinner.style.display = 'inline-block';
            arrowIcon.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    btnText.textContent = 'Acceso concedido';
                    // Redirigir al visualizador
                    window.location.href = '/';
                } else {
                    alertMsg.textContent = data.message || 'Usuario o contraseña incorrectos.';
                    alertBox.style.display = 'flex';
                    btnSubmit.disabled = false;
                    btnText.textContent = 'Ingresar al Sistema';
                    btnSpinner.style.display = 'none';
                    arrowIcon.style.display = 'inline-block';
                    passInput.value = '';
                    passInput.focus();
                }
            } catch (err) {
                alertMsg.textContent = 'Error de conexión con el servidor. Reintente.';
                alertBox.style.display = 'flex';
                btnSubmit.disabled = false;
                btnText.textContent = 'Ingresar al Sistema';
                btnSpinner.style.display = 'none';
                arrowIcon.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
